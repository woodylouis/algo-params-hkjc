spring.application.name=demo

# JDBC URL for SQL Server with Windows Integrated Authentication
spring.datasource.url=jdbc:sqlserver://QFMBDB2LSR3A:40000;databaseName=QFM;integratedSecurity=true;encrypt=true;trustServerCertificate=true;

# No username/password required for integrated security
# (Remove them if present, as they would force SQL authentication)

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Optional but recommended for JPA/Hibernate
spring.jpa.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true

# Additional connection pool settings (Hikari is default in Spring Boot)
spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

# Custom app settings
app.number-of-threads=20
app.seconds-for-end-date=60